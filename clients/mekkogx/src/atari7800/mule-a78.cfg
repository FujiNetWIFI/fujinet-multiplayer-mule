# mule-a78.cfg -- M.U.L.E. on the Atari 7800: a SuperGame image with the
# cart's RAM (the claim's kind 5, flags 1) for the FujiNet 7800 cartridge.
# 128K in eight 16K banks; the window at $8000-$BFFF takes banks 0-6, bank 7
# sits at $C000 for good.
#
# Each code segment's constants are a segment of their own (REPLRO,
# OVLnRO), so tools/atari7800/mkrom.py checks only code.
#
#   banks 0-6   $8000-$9FFF  REPL: the same 8K in every one of them (linked
#                            into bank 0, copied to 1-6 by
#                            tools/atari7800/mkrepl.py), so its code runs
#                            whichever bank is in: text, fx, map, nsnet, test
#               $A000-$BFFF  the bank's own: OVERLAY1-5 (a phase's code),
#                            ART (the original's graphics), STRS (strings)
#   bank 7      $C000-$FF6F  the program, then the claim ("FUJI" at $FF70,
#                            which keeps the cartridge's mailbox alive), the
#                            BIOS's signature area and the vectors
#
# RAM: zero page $40-$FF; the console's RAM holds the display lists, which
# MARIA reads in a 2-cycle window (atari7800/a78hw.h: the map); the cart's
# 16K at $4000 the character blocks MARIA reads, the screen, the data, the
# variables and the C stack.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0300;
}
MEMORY {
    ZP:     file = "", start = $0040, size = $00C0, type = rw, define = yes;
    CONS1:  file = "", start = $1800, size = $0840, type = rw, define = yes;
    CONS2:  file = "", start = $2100, size = $0040, type = rw, define = yes;
    CONS3:  file = "", start = $2200, size = $0600, type = rw, define = yes;
    BLOCKS: file = "", start = $4000, size = $23C0, type = rw, define = yes;
    CRAM:   file = "", start = $63C0, size = $4000 - $23C0 - __STACKSIZE__, type = rw, define = yes;
    CSTACK: file = "", start = $8000 - __STACKSIZE__, size = __STACKSIZE__, type = rw, define = yes;
    R0:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF, define = yes;
    B0:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, define = yes;
    R1:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B1:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, define = yes;
    R2:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B2:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, define = yes;
    R3:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B3:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, define = yes;
    R4:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B4:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, define = yes;
    R5:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B5:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, define = yes;
    R6:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B6:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, define = yes;
    FIXED:  file = %O, start = $C000, size = $3F70, fill = yes, fillval = $FF, define = yes;
    CLAIM:  file = %O, start = $FF70, size = $000A, fill = yes, fillval = $00;
    SIG:    file = %O, start = $FF7A, size = $007E, fill = yes, fillval = $FF;
    VECS:   file = %O, start = $FFF8, size = $0008;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    EXTZP:    load = ZP,     type = zp, optional = yes;
    DLSLOTS:  load = CONS1,  type = bss, define = yes;
    CONSBSS:  load = CONS3,  type = bss, define = yes, optional = yes;
    CONSBSS2: load = CONS2,  type = bss, optional = yes;
    CHARS:    load = BLOCKS, type = bss, define = yes, optional = yes;
    REPL:     load = R0,     type = ro, define = yes, optional = yes;
    REPLRO:   load = R0,     type = ro, define = yes, optional = yes;
    OVERLAY1: load = B0,     type = ro, define = yes, optional = yes;
    OVL1RO:   load = B0,     type = ro, define = yes, optional = yes;
    OVERLAY2: load = B1,     type = ro, define = yes, optional = yes;
    OVL2RO:   load = B1,     type = ro, define = yes, optional = yes;
    OVERLAY3: load = B2,     type = ro, define = yes, optional = yes;
    OVL3RO:   load = B2,     type = ro, define = yes, optional = yes;
    OVERLAY4: load = B3,     type = ro, define = yes, optional = yes;
    OVL4RO:   load = B3,     type = ro, define = yes, optional = yes;
    OVERLAY5: load = B4,     type = ro, define = yes, optional = yes;
    OVL5RO:   load = B4,     type = ro, define = yes, optional = yes;
    ART:      load = B5,     type = ro, define = yes, optional = yes;
    FONT:     load = B5,     type = ro, define = yes, optional = yes;
    MAPCHARS: load = B5,     type = ro, define = yes, optional = yes;
    TOWNCHARS: load = B5,    type = ro, define = yes, optional = yes;
    STRS:     load = B6,     type = ro, define = yes, optional = yes;
    STARTUP:  load = FIXED,  type = ro, define = yes;
    LOWCODE:  load = FIXED,  type = ro, optional = yes;
    ONCE:     load = FIXED,  type = ro, optional = yes;
    CODE:     load = FIXED,  type = ro, define = yes;
    RODATA:   load = FIXED,  type = ro, define = yes;
    DATA:     load = FIXED,  run = CRAM, type = rw, define = yes;
    BSS:      load = CRAM,   type = bss, define = yes;
    CLAIM:    load = CLAIM,  type = ro;
    VECTORS:  load = VECS,   type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
