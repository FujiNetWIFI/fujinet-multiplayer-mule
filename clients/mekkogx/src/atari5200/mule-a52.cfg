# mule-a52.cfg -- M.U.L.E. on the Atari 5200: a 128K Super Cart (the
# claim's kind 4) for the FujiNet 5200 cartridge, four 32K banks. A bank is
# the whole cart window, $4000-$BFFF: a read of $BFD0 + 4n picks bank n,
# and the console starts in the last.
#
# Each code segment's constants are a segment of their own (OVLnRO), so
# tools/atari5200/mkrom.py checks only code. Every bank:
#
#   $4000-__REPL__-1  the bank's own: OVERLAY1-5 (a phase's code), STRS
#                     (the strings), and what the crt0 copies into RAM
#                     (the charsets, the sprite shapes and tables)
#   __REPL__-$AFFF    REPL: the program, the same in every bank (linked
#   $B800-$BFBB       into bank 3, copied to 0-2 by mkrom.py), so it runs
#                     whichever bank is in
#   $B000-$B7FF       the cartridge's mailbox, over every bank ($FF here)
#   $BFC0-$BFDF       the bank switch's reads ($FF)
#   $BFE0-$BFFF       the claim ("FUJI", which keeps the mailbox alive)
#                     and the BIOS's header
#
# RAM, 16K: zero page $1D-$FF ($00-$18 the crt0's VBI's), the vectors at
# $0200-$021B, the variables, the art the crt0 copies, the C stack, then
# the Atari 800's graphics at $2800-$3FFF (src/atari/hw.inc).
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0180;
    __REPL__:      type = weak, value = $6500;
}
MEMORY {
    ZP:      file = "", start = $001D, size = $00E3, type = rw, define = yes;
    RAM:     file = "", start = $021C, size = $2800 - $021C - __STACKSIZE__, type = rw, define = yes;
    CSTACK:  file = "", start = $2800 - __STACKSIZE__, size = __STACKSIZE__, type = rw, define = yes;
    FONTM:   file = "", start = $2C00, size = $0200, type = rw;
    MAPCHM:  file = "", start = $2E00, size = $0200, type = rw;
    TOWNCHM: file = "", start = $3000, size = $0400, type = rw;
    PMGFREE: file = "", start = $3850, size = $02B0, type = rw;

    O0:  file = %O, start = $4000, size = __REPL__ - $4000, fill = yes, fillval = $FF, define = yes;
    RL0: file = %O, start = __REPL__, size = $B000 - __REPL__, fill = yes, fillval = $FF;
    AR0: file = %O, start = $B000, size = $0800, fill = yes, fillval = $FF;
    RH0: file = %O, start = $B800, size = $07C0, fill = yes, fillval = $FF;
    HT0: file = %O, start = $BFC0, size = $0040, fill = yes, fillval = $FF;
    O1:  file = %O, start = $4000, size = __REPL__ - $4000, fill = yes, fillval = $FF, define = yes;
    RL1: file = %O, start = __REPL__, size = $B000 - __REPL__, fill = yes, fillval = $FF;
    AR1: file = %O, start = $B000, size = $0800, fill = yes, fillval = $FF;
    RH1: file = %O, start = $B800, size = $07C0, fill = yes, fillval = $FF;
    HT1: file = %O, start = $BFC0, size = $0040, fill = yes, fillval = $FF;
    O2:  file = %O, start = $4000, size = __REPL__ - $4000, fill = yes, fillval = $FF, define = yes;
    RL2: file = %O, start = __REPL__, size = $B000 - __REPL__, fill = yes, fillval = $FF;
    AR2: file = %O, start = $B000, size = $0800, fill = yes, fillval = $FF;
    RH2: file = %O, start = $B800, size = $07C0, fill = yes, fillval = $FF;
    HT2: file = %O, start = $BFC0, size = $0040, fill = yes, fillval = $FF;
    O3:  file = %O, start = $4000, size = __REPL__ - $4000, fill = yes, fillval = $FF, define = yes;
    RL3: file = %O, start = __REPL__, size = $B000 - __REPL__, fill = yes, fillval = $FF, define = yes;
    AR3: file = %O, start = $B000, size = $0800, fill = yes, fillval = $FF;
    RH3: file = %O, start = $B800, size = $07BC, fill = yes, fillval = $FF, define = yes;
    GD3: file = %O, start = $BFBC, size = $0004, fill = yes, fillval = $FF;
    HS3: file = %O, start = $BFC0, size = $0020, fill = yes, fillval = $FF;
    CL3: file = %O, start = $BFE0, size = $0008, fill = yes, fillval = $00;
    HD3: file = %O, start = $BFE8, size = $0018;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    EXTZP:    load = ZP,     type = zp, optional = yes;
    # bank 0 (the bank of each is in bank.c and crt0.s)
    OVERLAY5: load = O0,     type = ro, define = yes, optional = yes;
    OVL5RO:   load = O0,     type = ro, define = yes, optional = yes;
    OVERLAY3: load = O0,     type = ro, define = yes, optional = yes;
    OVL3RO:   load = O0,     type = ro, define = yes, optional = yes;
    # bank 1
    OVERLAY4: load = O1,     type = ro, define = yes, optional = yes;
    OVL4RO:   load = O1,     type = ro, define = yes, optional = yes;
    FONT:     load = O1, run = FONTM,   type = rw, define = yes;
    MAPCHARS: load = O1, run = MAPCHM,  type = rw, define = yes;
    TOWNCHARS: load = O1, run = TOWNCHM, type = rw, define = yes;
    # bank 2
    OVERLAY2: load = O2,     type = ro, define = yes, optional = yes;
    OVL2RO:   load = O2,     type = ro, define = yes, optional = yes;
    STRS:     load = O2,     type = ro, define = yes, optional = yes;
    # bank 3, the boot bank
    OVERLAY1: load = O3,     type = ro, define = yes, optional = yes;
    OVL1RO:   load = O3,     type = ro, define = yes, optional = yes;
    SHAPES:   load = O3, run = RAM,     type = rw, define = yes;
    # REPL
    STARTUP:  load = RL3,    type = ro, define = yes;
    LOWCODE:  load = RL3,    type = ro, optional = yes;
    ONCE:     load = RL3,    type = ro, optional = yes;
    CODE:     load = RL3,    type = ro, define = yes;
    RODATA:   load = RH3,    type = ro, define = yes;
    HICODE:   load = RH3,    type = ro, define = yes, optional = yes;
    DATA:     load = RH3, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    LOWBSS:   load = RAM,    type = bss, optional = yes;
    BSS2:     load = RAM,    type = bss, optional = yes;
    INIT:     load = RAM,    type = bss, optional = yes;
    PMGFREE:  load = PMGFREE, type = bss, optional = yes;
    CLAIM:    load = CL3,    type = ro;
    CARTHDR:  load = HD3,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
