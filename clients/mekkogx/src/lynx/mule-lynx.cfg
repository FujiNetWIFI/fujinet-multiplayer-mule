# mule-lynx.cfg -- M.U.L.E. on the Atari Lynx (a cart image, .lnx).
#
#   $0200-$9FFF  the program: code, data, variables (BSS)
#   $A000-$BFDF  SCREEN: the frame buffer shown (Mikey's DISPADR)
#   $C000-$DFDF  BACK: the background, what gfx_* draw (src/lynx/gfx.c)
#   $E000-       the overlay window: one phase's code at a time
#   then         the C stack, up to $FC00 (Suzy and Mikey from there)
#
# Both buffers sit below $FC00: the CPU copies between them, and it can't
# reach RAM under the Suzy/Mikey registers. The cart's directory
# (src/lynx/directory.s) lists the program and the overlays OVL1..5, which
# follow it in the image; bank.c loads them with lynx_load().
#
# crt0 puts the C stack at __MAIN_START__ + __MAIN_SIZE__ + __STACKSIZE__:
# __STACKSIZE__ here is the distance from the program's end to the top of
# the stack, past the buffers and the window.
SYMBOLS {
    __STARTOFDIRECTORY__: type = weak,   value = $00CB;     # just after the loader
    __BANK0BLOCKSIZE__:   type = weak,   value = $0400;     # 256K cart
    __BANK1BLOCKSIZE__:   type = weak,   value = $0000;
    __EXEHDR__:           type = import;
    __BOOTLDR__:          type = import;
    __MAINTOP__:          type = export, value = $A000;
    __SCREEN__:           type = export, value = $A000;
    __BACK__:             type = export, value = $C000;
    __OVLADDR__:          type = export, value = $E000;
    __OVLSIZE__:          type = export, value = $18A0;
    __STACKTOP__:         type = export, value = $FC00;
    __STACKSIZE__:        type = weak,   value = __STACKTOP__ - __MAINTOP__;
}
MEMORY {
    ZP:     file = "", define = yes, start = $0000, size = $0100;
    HEADER: file = %O,               start = $0000, size = $0040;
    BOOT:   file = %O,               start = $0200, size = __STARTOFDIRECTORY__;
    DIR:    file = %O,               start = $0000, size = 6 * 8;
    MAIN:   file = %O, define = yes, start = $0200, size = __MAINTOP__ - $0200;
    OVL1:   file = %O, define = yes, start = __OVLADDR__, size = __OVLSIZE__;
    OVL2:   file = %O, define = yes, start = __OVLADDR__, size = __OVLSIZE__;
    OVL3:   file = %O, define = yes, start = __OVLADDR__, size = __OVLSIZE__;
    OVL4:   file = %O, define = yes, start = __OVLADDR__, size = __OVLSIZE__;
    OVL5:   file = %O, define = yes, start = __OVLADDR__, size = __OVLSIZE__;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,     type = zp;
    EXTZP:     load = ZP,     type = zp,                optional = yes;
    APPZP:     load = ZP,     type = zp,                optional = yes;
    EXEHDR:    load = HEADER, type = ro;
    BOOTLDR:   load = BOOT,   type = ro;
    DIRECTORY: load = DIR,    type = ro;
    STARTUP:   load = MAIN,   type = ro,  define = yes;
    LOWCODE:   load = MAIN,   type = ro,  define = yes, optional = yes;
    ONCE:      load = MAIN,   type = ro,  define = yes, optional = yes;
    CODE:      load = MAIN,   type = ro,  define = yes;
    RODATA:    load = MAIN,   type = ro,  define = yes;
    DATA:      load = MAIN,   type = rw,  define = yes;
    BSS:       load = MAIN,   type = bss, define = yes;
    OVERLAY1:  load = OVL1,   type = ro,  define = yes, optional = yes;
    OVERLAY2:  load = OVL2,   type = ro,  define = yes, optional = yes;
    OVERLAY3:  load = OVL3,   type = ro,  define = yes, optional = yes;
    OVERLAY4:  load = OVL4,   type = ro,  define = yes, optional = yes;
    OVERLAY5:  load = OVL5,   type = ro,  define = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
