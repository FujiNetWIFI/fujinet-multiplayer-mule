# M.U.L.E. (Apple II, 128K): a ProDOS program around HGR page 1.
#
# Main RAM:
#   $0803-$1FFF  startup, data, the HGR tables and fonts, low code
#   $2000-$3FFF  HGR page 1 (zeros in the file: loading blanks it)
#   $4000-$9AFF  the core: code, read-only data, BSS
#   $9B00-$BAFF  the overlay window: one phase's code at a time
#   $BB00-$BEFF  the C stack
#   $D400-$DFFF  more code, in the language card (behind ProDOS's quit code)
# Auxiliary RAM (filled at start-up, see bank.c):
#   $0800-...    the five overlays, one after another
#   $8C00-...    AUXGFX: sprites and the town        (file MULE.6)
#   $A900-...    AUXTXT: the strings                 (file MULE.7)
#
# One MAIN memory area (cc65's AppleSingle header loads MAIN), segments
# placed by address; HGRPAGE reserves the screen so nothing spills into it.

FEATURES {
    STARTADDRESS: default = $0803;
}
SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $0006; # ProDOS file type
    __STACKSIZE__: type = weak, value = $0400; # 1k C stack
    __HIMEM__:     type = weak, value = $BF00; # below the ProDOS global page
    __LCADDR__:    type = weak, value = $D400; # Behind quit code
    __LCSIZE__:    type = weak, value = $0C00; # Rest of bank two
    __OVLADDR__:   type = export, value = $9B00;
    __OVLSIZE__:   type = export, value = $2000;
    __AUXGFX__:    type = export, value = $8C00;
    __AUXTXT__:    type = export, value = $A900;
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,        size = $0030;
    HEADER: file = %O,               start = %S - $003A,   size = $003A;
    MAIN:   file = %O, define = yes, start = %S,           size = __OVLADDR__ - %S;
    BSS:    file = "",               start = __ONCE_RUN__, size = __OVLADDR__ - __ONCE_RUN__;
    LC:     file = "", define = yes, start = __LCADDR__,   size = __LCSIZE__;
    OVL1:   file = "%O.1",           start = __OVLADDR__,  size = __OVLSIZE__;
    OVL2:   file = "%O.2",           start = __OVLADDR__,  size = __OVLSIZE__;
    OVL3:   file = "%O.3",           start = __OVLADDR__,  size = __OVLSIZE__;
    OVL4:   file = "%O.4",           start = __OVLADDR__,  size = __OVLSIZE__;
    OVL5:   file = "%O.5",           start = __OVLADDR__,  size = __OVLSIZE__;
    AUXG:   file = "%O.6",           start = __AUXGFX__,   size = __AUXTXT__ - __AUXGFX__;
    AUXT:   file = "%O.7",           start = __AUXTXT__,   size = $C000 - __AUXTXT__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    LOWDATA:  load = MAIN,           type = ro,  optional = yes;   # tables, fonts, art
    HGRPAGE:  load = MAIN,           type = rw,  start = $2000;     # 8K, see hgrpage.s
    CODE:     load = MAIN,           type = ro,  start = $4000;
    RODATA:   load = MAIN,           type = ro;
    ONCE:     load = MAIN,           type = ro,  define = yes;
    LC:       load = MAIN, run = LC, type = ro,  optional = yes;
    BSS:      load = BSS,            type = bss, define = yes;
    OVERLAY1: load = OVL1,           type = ro,  define = yes, optional = yes;
    OVERLAY2: load = OVL2,           type = ro,  define = yes, optional = yes;
    OVERLAY3: load = OVL3,           type = ro,  define = yes, optional = yes;
    OVERLAY4: load = OVL4,           type = ro,  define = yes, optional = yes;
    OVERLAY5: load = OVL5,           type = ro,  define = yes, optional = yes;
    AUXGFX:   load = AUXG,           type = ro,  define = yes, optional = yes;
    AUXTXT:   load = AUXT,           type = ro,  define = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
