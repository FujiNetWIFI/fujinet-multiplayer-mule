# mule-atari.cfg -- M.U.L.E. on a 48K Atari 400/800 (and up).
#
#   $0480-$06FF  LOWBSS: variables (not loaded; picoboot is done with it)
#   $0700-$09FF  picoboot and its sector buffer while loading, then BSS2
#   $0A00-       the program: code, data, variables (BSS)
#   __OVLADDR__  the overlay window: one phase's code at a time
#   then         the C stack, up to the graphics
#   $A800-$BFFF  graphics (see atari.h): charsets, screen, display list, PMG
#
# The overlays (the phases) are PHASE.1 .. PHASE.5 on the disk, read into the
# window by src/atari/bank.c. The INIT chunk (src/atari/start.s) runs first:
# it switches BASIC off on an XL/XE, checks for 48K and blanks the screen.
FEATURES {
    STARTADDRESS: default = $0A00;
}
SYMBOLS {
    __STACKSIZE__:       type = weak, value = $0180;    # C stack
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $0000;
    __GFX_START__:       type = export, value = $A800;
    __OVLSIZE__:         type = export, value = $1980;   # auction.c (OVERLAY4) is the largest
    __OVLADDR__:         type = export, value = __GFX_START__ - __STACKSIZE__ - __OVLSIZE__;
    __SYSCHKHDR__:       type = export, value = 0;
    __SYSCHKTRL__:       type = export, value = 0;
}
MEMORY {
    ZP:      file = "", define = yes, start = $0082, size = $007E;
    LOW:     file = "", define = yes, start = $0480, size = $0280;
    LOW2:    file = "", define = yes, start = $0700, size = $0300;
    START:   file = %O,               start = $2E00, size = $0100;
    MAIN:    file = %O, define = yes, start = %S,    size = __OVLADDR__ - %S;
    FONT:    file = %O, define = yes, start = $AC00, size = $0200;
    MAPCH:   file = %O, define = yes, start = $AE00, size = $0200;
    PMGFREE: file = "",               start = $B850, size = $02B0;
    TOWNCH:  file = %O, define = yes, start = $B000, size = $0400;
    OVL1:    file = "%O.1",           start = __OVLADDR__, size = __OVLSIZE__;
    OVL2:    file = "%O.2",           start = __OVLADDR__, size = __OVLSIZE__;
    OVL3:    file = "%O.3",           start = __OVLADDR__, size = __OVLSIZE__;
    OVL4:    file = "%O.4",           start = __OVLADDR__, size = __OVLSIZE__;
    OVL5:    file = "%O.5",           start = __OVLADDR__, size = __OVLSIZE__;
}
FILES {
    %O: format = atari;
}
FORMATS {
    atari: runad = start,
           initad = START: mule_start;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    EXTZP:    load = ZP,     type = zp,               optional = yes;
    LOWBSS:   load = LOW,    type = bss,              optional = yes;
    BSS2:     load = LOW2,   type = bss,              optional = yes;
    MULESTART: load = START, type = ro;
    STARTUP:  load = MAIN,   type = ro,  define = yes;
    LOWCODE:  load = MAIN,   type = ro,  define = yes, optional = yes;
    ONCE:     load = MAIN,   type = ro,               optional = yes;
    CODE:     load = MAIN,   type = ro,  define = yes;
    RODATA:   load = MAIN,   type = ro;
    DATA:     load = MAIN,   type = rw;
    INIT:     load = MAIN,   type = bss, define = yes, optional = yes;
    BSS:      load = MAIN,   type = bss, define = yes;
    PMGFREE:  load = PMGFREE, type = bss,             optional = yes;
    FONT:     load = FONT,   type = ro;
    MAPCHARS: load = MAPCH,  type = ro;
    TOWNCHARS: load = TOWNCH, type = ro;
    OVERLAY1: load = OVL1,   type = ro,  define = yes, optional = yes;
    OVERLAY2: load = OVL2,   type = ro,  define = yes, optional = yes;
    OVERLAY3: load = OVL3,   type = ro,  define = yes, optional = yes;
    OVERLAY4: load = OVL4,   type = ro,  define = yes, optional = yes;
    OVERLAY5: load = OVL5,   type = ro,  define = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
