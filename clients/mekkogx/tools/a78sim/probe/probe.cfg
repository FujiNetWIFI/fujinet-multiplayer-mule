# probe.cfg -- the M0 probe: 32K at $8000, the claim (cart RAM at $4000).
MEMORY {
    ZP:    file = "", start = $0040, size = $00C0, type = rw;
    ROM:   file = %O, start = $8000, size = $7F70, type = ro, fill = yes, fillval = $FF;
    CLAIM: file = %O, start = $FF70, size = $000A, type = ro, fill = yes, fillval = $00;
    SIG:   file = %O, start = $FF7A, size = $007E, type = ro, fill = yes, fillval = $FF;
    VEC:   file = %O, start = $FFF8, size = $0008, type = ro;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    CODE:     load = ROM,   type = ro;
    RODATA:   load = ROM,   type = ro;
    CLAIM:    load = CLAIM, type = ro;
    VECTORS:  load = VEC,   type = ro;
}
